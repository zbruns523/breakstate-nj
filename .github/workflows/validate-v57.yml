name: Validate V57 Bathymetric Surface

on:
  push:
    branches: [bathymetric-surface-v57]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run 40,000-state regression suite
        run: node scripts/qa.js
      - name: Start BREAKSTATE server
        run: |
          node server.js > /tmp/breakstate.log 2>&1 &
          echo $! > /tmp/breakstate.pid
      - name: Verify server health and corridor endpoint
        run: |
          node - <<'NODE'
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          async function main(){
            let health;
            for(let i=0;i<15;i++){
              try{const r=await fetch('http://127.0.0.1:5173/api/health');if(r.ok){health=await r.json();break}}catch{}
              await wait(1000);
            }
            if(!health) throw new Error('server did not become healthy');
            const r=await fetch('http://127.0.0.1:5173/api/corridor?north=40.120&south=40.085&west=-74.055&east=-73.990');
            if(!r.ok) throw new Error('corridor HTTP '+r.status);
            const d=await r.json();
            if(!Array.isArray(d.samples)||d.samples.length<100) throw new Error('insufficient returned bathymetry');
            if(!(d.coverage>0.25)) throw new Error('insufficient source coverage');
            if(d.model?.status!=='NOT APPLIED TO DEPTH') throw new Error('unvalidated morphology altered depth');
            console.log('CONFIRMED health + Manasquan/Jenkinson corridor:',d.samples.length,'samples, coverage',d.coverage);
          }
          main().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/breakstate.log || true
