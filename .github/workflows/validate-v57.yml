name: Validate BREAKSTATE V59 MVP

on:
  push:
    branches: [mvp-rebuild-v59]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run 400 projection and architecture simulations
        run: npm test
      - name: Start BREAKSTATE
        run: |
          node server.js > /tmp/breakstate.log 2>&1 &
          echo $! > /tmp/breakstate.pid
      - name: Verify app shell and health
        run: |
          node - <<'NODE'
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          async function main(){let h;for(let i=0;i<20;i++){try{const r=await fetch('http://127.0.0.1:5173/api/health');if(r.ok){h=await r.json();break}}catch{}await wait(250)}if(!h||h.version!=='59.0.0-mvp')throw Error('V59 health failed');for(const p of ['/','/src/app.js','/src/style.css']){const r=await fetch('http://127.0.0.1:5173'+p);if(!r.ok)throw Error('asset failed '+p)}console.log('PASS app shell + health',h.version)}
          main().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Verify adjacent NOAA terrain tiles and cache
        run: |
          node - <<'NODE'
          async function get(p){const r=await fetch('http://127.0.0.1:5173'+p);if(!r.ok)throw Error(p+' '+r.status);const b=Buffer.from(await r.arrayBuffer());if(b.length<1000||b[0]!==0x89||b[1]!==0x50)throw Error(p+' not PNG');return {r,b}}
          async function main(){const paths=['/api/terrain/14/4821/6162.png','/api/terrain/14/4822/6162.png','/api/terrain/14/4821/6163.png'];for(const p of paths)await get(p);const second=await get(paths[0]);const cache=second.r.headers.get('x-breakstate-cache');const projection=second.r.headers.get('x-breakstate-projection');if(!['DISK','COALESCED'].includes(cache))throw Error('cache not persistent: '+cache);if(projection!=='EPSG:3857')throw Error('projection header wrong: '+projection);console.log('PASS adjacent terrain responses + persistent cache + EPSG:3857')}
          main().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/breakstate.log || true
